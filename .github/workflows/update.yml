name: Update yield curve tracker

on:
  schedule:
    # 10:00 UTC, Mon-Fri (after Treasury/Fed/NY Fed sources roll to the prior close)
    - cron: '0 10 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run pipeline
        working-directory: scripts
        run: |
          python3 01_fetch_treasury_yields.py
          python3 02_fetch_kim_wright.py
          python3 03_fetch_acm.py
          python3 04_fetch_fedtarmdlr.py
          python3 05_build_estimates.py --force
          python3 06_build_dashboard.py

      - name: Commit updated dashboard if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Update dashboard $(date -u +%Y-%m-%d)"
          git push
